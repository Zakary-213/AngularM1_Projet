name: 🐛 Bug
description: Signaler un comportement incorrect
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1.
        2.
        3.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: Navigateur, système, taille d'écran
  - type: textarea
    id: logs
    attributes:
      label: Console / Network
      description: Ne jamais coller de token, mot de passe ou contenu de `.env`.
      render: text
